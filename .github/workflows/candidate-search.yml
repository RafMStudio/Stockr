name: Higher frequency strategy search
on:
  push:
    branches: [research/high-frequency-candidates]
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy yfinance
      - run: python candidate_search.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-search-results
          path: candidate_results/
