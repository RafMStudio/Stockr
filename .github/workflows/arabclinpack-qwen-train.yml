name: ArabClinPack Qwen Adapter Train
on:
  push:
    branches: [arabclinpack-qwen-eval]
    paths:
      - 'arabclinpack_eval/train_adapter.b64'
      - 'arabclinpack_eval/chunks/**'
      - '.github/workflows/arabclinpack-qwen-train.yml'
  workflow_dispatch:

jobs:
  train-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODEL_ID: Qwen/Qwen2.5-0.5B-Instruct
      HF_HUB_DISABLE_XET: "1"
      TOKENIZERS_PARALLELISM: "false"
      TRAIN_STEPS: "80"
      EVAL_N: "24"
      MAX_LEN: "160"
      LR: "0.01"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct frozen ArabClinPack and trainer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arabclinpack_eval/core
          cat arabclinpack_eval/chunks/part{1..6}.b64 | base64 -d > /tmp/acp_core.tar.xz
          echo "1b4854b650decf97bd685732cec7bbec77320c532f6d2233789cf9ca5af4c864  /tmp/acp_core.tar.xz" | sha256sum -c -
          tar -xJf /tmp/acp_core.tar.xz -C arabclinpack_eval/core
          base64 -d arabclinpack_eval/train_adapter.b64 | xz -d > arabclinpack_eval/train_acp_qwen_adapter.py
          echo "aa601734183d2f373ea5c9d0674ecb97f16a75130d1f32fb7e68cebab95edcac  arabclinpack_eval/train_acp_qwen_adapter.py" | sha256sum -c -
          python -m py_compile arabclinpack_eval/train_acp_qwen_adapter.py
          python -c "from pathlib import Path; import hashlib; root=Path('arabclinpack_eval/core'); files=['data/concepts.json','data/learned_spans.json','data/morphology.json','data/factorization.json','data/fusion_fragments.json']; h=hashlib.sha256(); [(h.update(r.encode()),h.update(b'\\0'),h.update((root/r).read_bytes()),h.update(b'\\0')) for r in files]; assert h.hexdigest()=='5dbb2ca2a9c8737bcc2a0f22fea61907bdc5f612458841ebd689c7dd8dc59bbe'"
      - name: Install CPU model runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.45,<5" sentencepiece safetensors
      - name: Train only ArabClinPack added embeddings on MedAraBench train split
        env:
          ACP_ROOT: arabclinpack_eval/core
          OUT_JSON: arabclinpack_eval/results_qwen_trained.json
          ADAPTER_OUT: arabclinpack_eval/adapter_qwen_v12.pt
        run: python arabclinpack_eval/train_acp_qwen_adapter.py
      - name: Write summary
        if: always()
        shell: bash
        run: |
          if [ -f arabclinpack_eval/results_qwen_trained.json ]; then
            echo "# ArabClinPack v1.2 × Qwen2.5-0.5B adapter training" >> "$GITHUB_STEP_SUMMARY"
            python -c "import json; r=json.load(open('arabclinpack_eval/results_qwen_trained.json')); print('Before:',{k:v for k,v in r['before'].items() if k!='rows'}); print('After:',{k:v for k,v in r['after'].items() if k!='rows'}); print('Delta:',r['delta'])" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload trained adapter and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arabclinpack-qwen-0.5b-trained-adapter
          path: |
            arabclinpack_eval/results_qwen_trained.json
            arabclinpack_eval/adapter_qwen_v12.pt
