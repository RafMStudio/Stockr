name: Backtest regression tests
on:
  pull_request:
  push:
    branches: [fix/backtest-execution-accounting]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas
      - run: python -m py_compile v12.py backtest_engine.py
      - run: python -m unittest -v test_backtest_engine
