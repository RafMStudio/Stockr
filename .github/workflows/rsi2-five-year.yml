name: RSI2 five-year evaluation
on:
  push:
    branches: [research/rsi2-five-year]
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy yfinance
      - run: python rsi2_five_year.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rsi2-five-year-results
          path: rsi2_results/
