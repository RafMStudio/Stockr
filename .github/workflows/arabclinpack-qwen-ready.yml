name: ArabClinPack Qwen-Ready Bridge
on:
  push:
    branches: [arabclinpack-qwen-eval]
    paths:
      - 'arabclinpack_eval/qwen_ready_bridge.b64'
      - 'arabclinpack_eval/chunks/**'
      - '.github/workflows/arabclinpack-qwen-ready.yml'
  workflow_dispatch:

jobs:
  qwen-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODEL_ID: Qwen/Qwen2.5-0.5B-Instruct
      HF_HUB_DISABLE_XET: "1"
      TOKENIZERS_PARALLELISM: "false"
      TRAIN_STEPS: "160"
      TRAIN_POOL: "384"
      EVAL_N: "64"
      MAX_LEN: "180"
      LR: "0.0015"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reconstruct frozen ArabClinPack and Qwen-ready bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p arabclinpack_eval/core
          cat arabclinpack_eval/chunks/part{1..6}.b64 | base64 -d > /tmp/acp_core.tar.xz
          echo "1b4854b650decf97bd685732cec7bbec77320c532f6d2233789cf9ca5af4c864  /tmp/acp_core.tar.xz" | sha256sum -c -
          tar -xJf /tmp/acp_core.tar.xz -C arabclinpack_eval/core
          base64 -d arabclinpack_eval/qwen_ready_bridge.b64 | xz -d > arabclinpack_eval/qwen_ready_bridge.py
          echo "68506702dc03b1113598cdc299f1af844d5da6ed70d0bf77232041af01913dbf  arabclinpack_eval/qwen_ready_bridge.py" | sha256sum -c -
          python -m py_compile arabclinpack_eval/qwen_ready_bridge.py
      - name: Install CPU model runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "transformers>=4.45,<5" sentencepiece safetensors
      - name: Train and evaluate continuous embedding bridge
        env:
          ACP_ROOT: arabclinpack_eval/core
          OUT_JSON: arabclinpack_eval/results_qwen_ready_bridge.json
          BRIDGE_OUT: arabclinpack_eval/qwen_ready_bridge.pt
        run: python arabclinpack_eval/qwen_ready_bridge.py
      - name: Write summary
        if: always()
        shell: bash
        run: |
          if [ -f arabclinpack_eval/results_qwen_ready_bridge.json ]; then
            echo "# Qwen-ready continuous embedding bridge" >> "$GITHUB_STEP_SUMMARY"
            python -c "import json; r=json.load(open('arabclinpack_eval/results_qwen_ready_bridge.json')); print('Before:',{k:v for k,v in r['before'].items() if k!='rows'}); print('After:',{k:v for k,v in r['after'].items() if k!='rows'}); print('Delta:',r['delta'])" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arabclinpack-qwen-ready-bridge
          path: |
            arabclinpack_eval/results_qwen_ready_bridge.json
            arabclinpack_eval/qwen_ready_bridge.pt
