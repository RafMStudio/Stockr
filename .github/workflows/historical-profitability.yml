name: Historical profitability
on:
  push:
    branches: [research/historical-profitability]
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandas numpy pandas-ta yfinance
      - run: python -m unittest -v test_backtest_engine
      - run: python historical_profitability.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-results
          path: historical_results/
